<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="10家日本转运仓优缺点、尾货留库、打包沟通与空海运费用对比。">
  <meta name="theme-color" content="#233e32">
  <title>日本转运仓对比</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23233e32'/%3E%3Cpath d='M10 15l10-5 10 5v13l-10 5-10-5zM10 15l10 5 10-5M20 20v13' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=report2">
  <script src="data.js?v=report2" defer></script>
  <script src="app.js?v=report2" defer></script>
</head>
<body>
<main class="page" id="main">
  <header class="page-header">
    <div class="brand"><h1>日本转运仓对比</h1><p class="subtitle">10家 · 自购周边寄往中国大陆</p></div>
    <div class="header-meta"><span>资料核验 <time datetime="2026-11-06">2026.11.06</time></span></div>
  </header>
  <section class="calculator-bar" aria-label="统一比价参数">
    <div class="form-main">
      <label for="weight">预计打包重量 <span>kg</span><input id="weight" type="number" min="0.1" max="30" step="0.1" value="5" inputmode="decimal"></label>
      <label for="packages">入库包裹数 <span>个</span><input id="packages" type="number" min="1" max="20" step="1" value="10" inputmode="numeric"></label>
      <label for="fx">汇率（非实时） <span>100日元＝人民币</span><input id="fx" type="number" min="0.01" max="30" step="0.01" value="4.50" inputmode="decimal"></label>
    </div>
    <details class="size-options"><summary>尺寸（选填，用于适用线路体积重）</summary><div class="size-fields"><label for="length">长 <span>cm</span><input id="length" type="number" min="0.1" max="300" step="0.1" placeholder="选填"></label><label for="width">宽 <span>cm</span><input id="width" type="number" min="0.1" max="300" step="0.1" placeholder="选填"></label><label for="height">高 <span>cm</span><input id="height" type="number" min="0.1" max="300" step="0.1" placeholder="选填"></label></div></details>
    <div class="control-footer"><p class="price-note">单个出库箱的已知小计，统一折算人民币；箱材、加固、税费未计。</p><label for="sort">排序 <select id="sort"><option value="default">默认顺序</option><option value="air">空运已知费用</option><option value="sea">海运已知费用</option></select></label></div>
    <p id="formError" class="form-error" role="alert"></p>
  </section>
  <p class="table-note" id="comparisonNote">左右滑动查看全部列，点击金额看明细。各仓线路有差异；冲突价及有歧义的模型不参与费用排序。</p>
  <div class="comparison-table-wrap" role="region" aria-label="10家仓库对比报表" tabindex="0">
    <table id="compareTable"><caption class="sr-only">10家日本转运仓优缺点、尾货留库、打包沟通及空海费用</caption><thead><tr><th scope="col">仓库</th><th scope="col">优点 / 不足</th><th scope="col">尾货留到下批</th><th scope="col">打包沟通 / 空海调配</th><th scope="col">空运估算 <small>元</small></th><th scope="col">海运估算 <small>元</small></th></tr></thead><tbody id="comparisonBody"></tbody></table>
  </div>
  <footer class="footer-bar"><span>尾货＝少量剩余商品，留仓及空海分发条件需按订单确认。</span><div><button class="text-button" id="allSources">全部出处</button><button class="text-button" id="generalInquiry">复制询价</button><button class="text-button" id="printButton">打印</button></div></footer>
  <p id="copyStatus" class="copy-status" role="status"></p>
</main>
<dialog id="vendorDialog" aria-labelledby="vendorDialogTitle"><div class="dialog-head"><h2 id="vendorDialogTitle">仓库信息</h2><button class="close-button" data-close="vendorDialog" aria-label="关闭仓库详情">×</button></div><div id="vendorDialogBody"></div></dialog>
<dialog id="sourceDialog" aria-labelledby="sourceDialogTitle"><div class="dialog-head"><h2 id="sourceDialogTitle">官方依据</h2><button class="close-button" data-close="sourceDialog" aria-label="关闭来源详情">×</button></div><div id="sourceDialogBody"></div></dialog>
<noscript><p>请启用 JavaScript 查看仓库对比及费用计算。</p></noscript>
</body>
</html>
